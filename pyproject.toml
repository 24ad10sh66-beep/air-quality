[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality"
version = "0.1.0"
description = "Air-quality analytics and forecasting framework"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
data = [
    "numpy==2.2.6",
    "pandas==3.0.3",
    "scipy==1.17.1",
    "matplotlib",
    "plotly",
]
ml = [
    "scikit-learn==1.8.0",
    "joblib==1.6.0",
]
api = [
    "fastapi==0.103.2",
    "uvicorn==0.30.6",
    "pydantic==1.10.26",
    "sqlalchemy>=2,<3",
    "pymysql",
    "python-dotenv",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
